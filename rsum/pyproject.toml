[project]
name = "rsum"
dynamic = ["version"]
description = "An archive of rḗsumḗs in varius formats"
authors = [{ name = "Xander Harris", email = "xandertheharris@gmail.com" }]
readme = "readme.md"
requires-python = ">=3.12,<4.0.0"
dependencies = [
  "sphinx (>=7.0.0,<9.0.0)",
  "myst-parser[linkify] (>=4.0.1,<5.0.0)",
  "sphinx-book-theme (>=1.1.4,<2.0.0)",
  "sphinx-autobuild (>=2025.8.25,<2026.0.0)",
  "version-query (>=1.7.0,<2.0.0)",
  "loguru (>=0.7.3,<0.8.0)",
  "sphinx-copybutton (>=0.5.2,<0.6.0)",
  "sphinxcontrib-autoyaml (>=1.1.3,<2.0.0)",
]

[build-system]
requires = ["setuptools >= 70.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "version_query.local_git_version.PREDICTED" }

[tool.poetry]
packages = [{ include = "rsum", from = "src" }]
version = "0.0.0"

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = { version = ">=1.0.0,<2.0.0", extras = ["plugin"] }

[tool.poetry-dynamic-versioning]
enable = true

[dependency-groups]
dev = ["black (>=25.12.0,<26.0.0)"]
